name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native C++ rules
        run: bash scripts/test-native.sh
      - name: WASM sidecar and ABI
        run: bash blob/check-blob.sh --strict
      - name: Reproducible WASM rebuild
        run: bash blob/check-blob.sh --rebuild --strict
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm run verify:css
      - run: npm run build
      - run: NEXT_PUBLIC_GAME_ID=xarc bash scripts/build-export.sh --bundle
