<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penalty Pulse · hotseat prototype</title>
<style>
  *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top,#236a4b,#061f1c 65%);color:#f6f5e9;font:16px system-ui,sans-serif;display:grid;place-items:center;padding:12px}
  main{width:min(100%,620px);background:#0b2e27;border:1px solid #6ead82;border-radius:20px;overflow:hidden;box-shadow:0 24px 70px #0007}
  header{padding:22px;background:#09251f;display:flex;justify-content:space-between;align-items:center;gap:10px}h1{margin:0;font-size:clamp(24px,6vw,37px);font-style:italic;letter-spacing:-.05em}small{color:#b5d9b9;font-size:11px;letter-spacing:.1em;text-transform:uppercase}.score{font-size:28px;font-weight:950;color:#e6ce78}
  section{padding:22px}#pitch{min-height:220px;background:repeating-linear-gradient(0deg,#16533d 0 35px,#195a42 35px 70px);display:grid;place-items:center}
  .goal{width:100%;height:125px;border:7px solid #f2f5e6;display:grid;grid-template-columns:repeat(3,1fr);background:repeating-linear-gradient(90deg,transparent 0 20px,#e7ffe335 21px 22px)}
  button{font:inherit;cursor:pointer;border:0}.goal button{background:#0a2a2699;color:white;border-right:1px solid #fff9;font-size:12px;font-weight:900}.goal button:last-child{border:0}.goal button.active{background:#dbbd63bb;color:#14291c}
  #status{font-size:19px;font-weight:800;line-height:1.3;margin:0 0 16px}#pick{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 15px}.player{background:#d8e8d8;color:#143d29;border-radius:99px;padding:8px 11px;font-size:12px;font-weight:750}.player.active{background:#e4c868}.player:disabled{opacity:.3}.action{width:100%;background:#e5c35e;color:#122d1e;border-radius:10px;padding:13px;font-weight:900;text-transform:uppercase}.action:disabled{opacity:.35}.note{margin:7px 0;color:#bdd7bd;font-size:12px}#handoff{position:fixed;inset:0;background:#051813f5;display:none;place-items:center;padding:18px;text-align:center}#handoff.show{display:grid}#handoff button{background:#e5c35e;color:#12331f;border-radius:10px;padding:14px 30px;font-weight:900}
</style>
<main><header><div><small>Soccerverse · hotseat prototype</small><h1>PENALTY PULSE</h1></div><div class="score" id="score">0 : 0</div></header>
  <section id="pitch"><div class="goal" id="goal"></div></section>
  <section><small id="round"></small><p id="status"></p><div id="pick"></div><button class="action" id="action"></button><p class="note" id="note">Three shots each. The striker picks a player, then the keeper secretly chooses a lane. The striker aims last. Same lane as the keeper means a save.</p></section></main>
<div id="handoff"><div><h2 id="handoff-title"></h2><p>Pass the device to the next player.</p><button id="continue">Continue</button></div></div>
<script>
  const players=[{id:1100,name:'Erling Braut Haaland'},{id:278,name:'Kylian Mbappé Lottin'},{id:154,name:'Lionel Messi'},{id:874,name:'Cristiano Ronaldo'},{id:129718,name:'Jude Bellingham'},{id:1,name:'Roman Bürki'},{id:2,name:'Marwin Hitz'},{id:3,name:'Eric Dirk Oelschlägel'}];
  const names=['LEFT','CENTRE','RIGHT'],score=[0,0],used=[[],[]];let kick=0,phase='pick',guard=null,lane=null,player=null,last='';
  const el=id=>document.getElementById(id),primary=id=>id%3,secondary=id=>(primary(id)+1+Math.floor(id/3)%2)%3;
  const shooter=()=>kick%2,keeper=()=>1-shooter();
  function draw(){
    el('score').textContent=score.join(' : ');el('round').textContent=kick<6?'KICK '+(kick+1)+' OF 6':'FULL TIME';
    el('goal').innerHTML='';names.forEach((name,i)=>{const b=document.createElement('button');b.textContent=name;b.className=(phase==='guard'&&guard===i||phase==='shot'&&lane===i)?'active':'';b.disabled=phase!=='guard'&&phase!=='shot';b.onclick=()=>{if(phase==='guard')guard=i;else lane=i;draw()};el('goal').append(b)});
    el('pick').innerHTML='';
    if(phase==='pick')players.forEach(p=>{const b=document.createElement('button');b.className='player'+(player?.id===p.id?' active':'');b.textContent=p.name;b.disabled=used[shooter()].includes(p.id);b.onclick=()=>{player=p;draw()};el('pick').append(b)});
    if(phase==='done'){el('status').textContent=score[0]===score[1]?'DRAW': 'PLAYER '+(score[0]>score[1]?1:2)+' WINS';el('action').textContent='PLAY AGAIN';el('action').disabled=false;return}
    el('status').textContent=phase==='pick'?'Player '+(shooter()+1)+': choose your Soccerverse striker.':phase==='guard'?'Player '+(keeper()+1)+': choose where your keeper dives.':'Player '+(shooter()+1)+': aim your shot.';
    el('action').textContent=phase==='pick'?'CONFIRM PLAYER':phase==='guard'?'LOCK KEEPER DIVE':'TAKE SHOT';
    el('action').disabled=phase==='pick'?player===null:phase==='guard'?guard===null:lane===null;
    el('note').textContent=player?'Scoring lanes for '+player.name+': '+names[primary(player.id)]+' + '+names[secondary(player.id)]+'.':last||'Three shots each. Every player can score in two of the three lanes.';
  }
  el('action').onclick=()=>{if(phase==='done'){score.fill(0);used[0]=[];used[1]=[];kick=0;phase='pick';guard=lane=player=null;last='';draw();return}
    if(phase==='pick'){phase='guard';el('handoff-title').textContent='Player '+(keeper()+1)+', your keeper';el('handoff').classList.add('show');draw();return}
    if(phase==='guard'){phase='shot';el('handoff-title').textContent='Player '+(shooter()+1)+', your shot';el('handoff').classList.add('show');draw();return}
    const result=lane===guard?'SAVED':lane===primary(player.id)||lane===secondary(player.id)?'GOAL':'WIDE';
    if(result==='GOAL')score[shooter()]++;used[shooter()].push(player.id);last='Last kick: '+result+'.';kick++;guard=lane=player=null;phase=kick===6?'done':'pick';
    if(phase!=='done'){el('handoff-title').textContent='Player '+(shooter()+1)+', pick a striker';el('handoff').classList.add('show')}draw();
  };
  el('continue').onclick=()=>el('handoff').classList.remove('show');draw();
</script></html>
